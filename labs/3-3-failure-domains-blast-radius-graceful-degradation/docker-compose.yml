name: hlsa2-lab33

# Centralised env across containers: the gateway needs to know each
# dep's URL, the deps and gateway both need to know the fault-injector
# URL, and loadgen needs the gateway URL.
x-svc-env: &svc-env
  FAULT_INJECTOR_URL: http://fault-injector:9000
  LOG_LEVEL: info

services:
  fault-injector:
    build:
      context: .
      dockerfile: cmd/fault-injector/Dockerfile
    container_name: lab33-fault-injector
    environment:
      <<: *svc-env
      PORT: "9000"
    ports:
      - "${LAB_FAULT_INJECTOR_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  price:
    build:
      context: .
      dockerfile: cmd/dep-svc/Dockerfile
    container_name: lab33-price
    environment:
      <<: *svc-env
      PORT: "8091"
      DEP_NAME: price
      BASE_LATENCY_MS: "20"
      JITTER_MS: "10"
    ports:
      - "${LAB_PRICE_PORT:-8091}:8091"
    depends_on:
      fault-injector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  cart:
    build:
      context: .
      dockerfile: cmd/dep-svc/Dockerfile
    container_name: lab33-cart
    environment:
      <<: *svc-env
      PORT: "8092"
      DEP_NAME: cart
      BASE_LATENCY_MS: "25"
      JITTER_MS: "12"
    ports:
      - "${LAB_CART_PORT:-8092}:8092"
    depends_on:
      fault-injector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  recommendations:
    build:
      context: .
      dockerfile: cmd/dep-svc/Dockerfile
    container_name: lab33-recommendations
    environment:
      <<: *svc-env
      PORT: "8093"
      DEP_NAME: recommendations
      BASE_LATENCY_MS: "60"
      JITTER_MS: "40"
    ports:
      - "${LAB_RECOMMENDATIONS_PORT:-8093}:8093"
    depends_on:
      fault-injector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  reviews:
    build:
      context: .
      dockerfile: cmd/dep-svc/Dockerfile
    container_name: lab33-reviews
    environment:
      <<: *svc-env
      PORT: "8094"
      DEP_NAME: reviews
      BASE_LATENCY_MS: "50"
      JITTER_MS: "30"
    ports:
      - "${LAB_REVIEWS_PORT:-8094}:8094"
    depends_on:
      fault-injector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  recently-viewed:
    build:
      context: .
      dockerfile: cmd/dep-svc/Dockerfile
    container_name: lab33-recently-viewed
    environment:
      <<: *svc-env
      PORT: "8095"
      DEP_NAME: recently-viewed
      BASE_LATENCY_MS: "40"
      JITTER_MS: "25"
    ports:
      - "${LAB_RECENTLY_VIEWED_PORT:-8095}:8095"
    depends_on:
      fault-injector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8095/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    container_name: lab33-gateway
    environment:
      <<: *svc-env
      PORT: "8080"
      PRICE_URL: http://price:8091
      CART_URL: http://cart:8092
      RECOMMENDATIONS_URL: http://recommendations:8093
      REVIEWS_URL: http://reviews:8094
      RECENTLY_VIEWED_URL: http://recently-viewed:8095
      BULKHEAD: "${BULKHEAD:-off}"
      CIRCUIT_BREAKER: "${CIRCUIT_BREAKER:-off}"
      FALLBACK: "${FALLBACK:-off}"
      RETRY_BUDGET: "${RETRY_BUDGET:-off}"
      LOAD_SHED: "${LOAD_SHED:-off}"
      # Sized so the unprotected baseline is stable at RATE=200 but
      # the shared pool starves clearly when a non-critical dep slows.
      MAX_CONNS_PER_HOST: "32"
      MAX_INFLIGHT: "256"
      DEP_TIMEOUT_MS: "800"
    ports:
      - "${LAB_GATEWAY_PORT:-8080}:8080"
    depends_on:
      price:
        condition: service_healthy
      cart:
        condition: service_healthy
      recommendations:
        condition: service_healthy
      reviews:
        condition: service_healthy
      recently-viewed:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10

  loadgen:
    build:
      context: .
      dockerfile: cmd/loadgen/Dockerfile
    container_name: lab33-loadgen
    environment:
      <<: *svc-env
      PORT: "8090"
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${LAB_LOADGEN_PORT:-8090}:8090"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lab33-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - lab33_prom_data:/prometheus
    ports:
      - "${LAB_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - gateway
      - fault-injector

  grafana:
    image: grafana/grafana:11.2.2
    container_name: lab33-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - lab33_grafana_data:/var/lib/grafana
    ports:
      - "${LAB_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  lab33_prom_data:
  lab33_grafana_data:
