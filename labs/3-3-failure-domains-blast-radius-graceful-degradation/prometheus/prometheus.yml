global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: deps
    static_configs:
      - targets:
          - "price:8091"
          - "cart:8092"
          - "recommendations:8093"
          - "reviews:8094"
          - "recently-viewed:8095"

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:8090"]

  - job_name: fault-injector
    static_configs:
      - targets: ["fault-injector:9000"]
