# Lab 4-2 - primary pg_hba: trust on the local container subnet so the
# replicas can authenticate without password fiddling. NOT secure for
# production - this is a teaching lab.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Replication: replicator user can stream from any docker-network IP.
host    replication     replicator      0.0.0.0/0               md5
host    replication     replicator      ::0/0                   md5

# Application traffic from the docker network.
host    all             all             0.0.0.0/0               md5
host    all             all             ::0/0                   md5
