# Lab 4-2 - primary Postgres tuned for streaming replication.
# These knobs are deliberately modest so the lab fits on a laptop;
# students should NOT copy them verbatim to production.

listen_addresses = '*'

# WAL + replication: enable physical streaming replication.
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 256MB
hot_standby = on

# Logging: lab is short-lived, log enough to debug reliably.
log_min_duration_statement = 250ms
log_replication_commands = on
log_line_prefix = '%m [%p] %u@%d '

# Don't fsync sync everything to disk on a laptop, but still keep WAL
# safe enough for the lab. Students who want a "real" run can set
# synchronous_commit=on.
synchronous_commit = on

# Modest worker tuning. Primary serves both writers and the lag
# sampler queries. Keep max_connections at the Postgres default (100)
# so the replicas (which reuse the primary's GUCs from the basebackup)
# don't refuse to start with "max_connections is a lower setting than
# on the primary".
shared_buffers = 256MB
effective_cache_size = 768MB
max_connections = 100
