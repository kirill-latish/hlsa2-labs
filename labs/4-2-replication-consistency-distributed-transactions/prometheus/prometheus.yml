global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets: [orchestrator:8080]

  - job_name: payment-svc
    static_configs:
      - targets: [payment-svc:8081]

  - job_name: inventory-svc
    static_configs:
      - targets: [inventory-svc:8082]

  - job_name: shipping-svc
    static_configs:
      - targets: [shipping-svc:8083]

  - job_name: lag-sampler
    static_configs:
      - targets: [lag-sampler:9101]

  - job_name: outbox-relay
    static_configs:
      - targets: [outbox-relay:9102]

  - job_name: consumer
    static_configs:
      - targets: [consumer:9103]

  - job_name: fault-injector
    metrics_path: /healthz
    static_configs:
      - targets: [fault-injector:9000]
