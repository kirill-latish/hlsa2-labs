# Postgres 16 — system of record for lab 4-3.
# Logical replication is enabled so Debezium can stream row-level changes.

listen_addresses = '*'
port = 5432
max_connections = 100

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 64MB

# --- Logical replication (Debezium) -------------------------------
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 256MB
wal_sender_timeout = 60s
wal_compression = on

# --- Logging ------------------------------------------------------
log_min_duration_statement = 200
log_line_prefix = '%t [%p]: db=%d,user=%u '
log_timezone = 'UTC'
timezone = 'UTC'

# Reasonable defaults so the lab is not bottlenecked on a laptop.
synchronous_commit = on
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
random_page_cost = 1.1
