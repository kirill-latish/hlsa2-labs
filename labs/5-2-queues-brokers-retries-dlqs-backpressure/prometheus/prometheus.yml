global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: producer
    static_configs:
      - targets: ["producer:8080"]

  - job_name: consumers
    static_configs:
      - targets:
          - "consumer-1:8081"
          - "consumer-2:8081"
          - "consumer-3:8081"

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:8090"]
