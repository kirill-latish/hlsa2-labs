global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: producer
    static_configs:
      - targets: ["producer:8080"]

  - job_name: outbox-relay
    static_configs:
      - targets: ["outbox-relay:9102"]

  - job_name: consumers
    static_configs:
      - targets:
          - "consumer-1:9103"
          - "consumer-2:9103"
          - "consumer-3:9103"
