global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: edge-proxy
    static_configs:
      - targets: ["edge-proxy:8080"]

  - job_name: backends
    static_configs:
      - targets:
          - "backend-1:8081"
          - "backend-2:8081"
          - "backend-3:8081"
          - "backend-4:8081"

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:8090"]
