global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: pops
    static_configs:
      - targets:
          - "pop-1:8080"
          - "pop-2:8080"
          - "pop-3:8080"

  - job_name: shield
    static_configs:
      - targets: ["shield:8080"]

  - job_name: origin
    static_configs:
      - targets: ["origin:8088"]

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:8090"]
